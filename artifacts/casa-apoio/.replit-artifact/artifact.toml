kind = "web"
previewPath = "/"
title = "Casa de Apoio - Sistema de Gestão"
version = "1.0.0"
id = "artifacts/casa-apoio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23522
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/casa-apoio run dev"

[services.env]
PORT = "23522"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/casa-apoio", "run", "build"]
publicDir = "artifacts/casa-apoio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
